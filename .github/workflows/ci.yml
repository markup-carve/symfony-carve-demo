name: CI

on:
  push:
    branches: [main, next2]
  pull_request:

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Boot, lint and test
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Clear the cache
        run: php bin/console cache:clear

      - name: Lint the service container
        run: php bin/console lint:container

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Run the page and feature tests
        run: vendor/bin/phpunit

      - name: Smoke-test every route through the built-in server
        run: |
          php -S 127.0.0.1:8000 -t public &
          SERVER_PID=$!
          sleep 2
          set -e
          routes=$(php bin/console debug:router --format=json | php -r '
            $pages = require "config/demo_pages.php";
            $routes = json_decode(stream_get_contents(STDIN), true);
            foreach (array_keys($pages) as $name) { echo $routes[$name]["path"], PHP_EOL; }')
          for route in $routes; do
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://127.0.0.1:8000$route")
            echo "$route -> $code"
            test "$code" = "200"
            grep -q 'href="https://markup-carve.github.io/carve/"' /tmp/page.html
          done

          asset_code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/diagram.svg")
          test "$asset_code" = "200"

          invalid_code=$(curl -s -o /tmp/invalid-form.html -w '%{http_code}' -X POST \
            -d 'article[title]=&article[body]=' "http://127.0.0.1:8000/form")
          test "$invalid_code" = "422"
          grep -q 'This value should not be blank' /tmp/invalid-form.html

          kill $SERVER_PID
