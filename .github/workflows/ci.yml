name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: Boot and lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint the service container
        run: php bin/console lint:container

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Smoke-test every route
        run: |
          php -S 127.0.0.1:8000 -t public &
          SERVER_PID=$!
          sleep 2
          set -e
          for route in / /twig-filter /twig-function /service /outputs-profiles /form /safe-mode /syntax /diagrams; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

          # The Diagrams page must emit the hydration markup for all eight presets.
          diagrams=$(curl -s "http://127.0.0.1:8000/diagrams")
          for marker in 'pre class="mermaid"' 'pre class="graphviz"' 'pre class="d2"' \
                        'pre class="plantuml"' 'class="vega-lite"' 'pre class="wavedrom"' \
                        'class="chart"' 'pre class="abc"'; do
            echo "$diagrams" | grep -q "$marker"
            echo "diagrams markup ok: $marker"
          done

          # The Syntax page must include the newer constructs.
          syntax=$(curl -s "http://127.0.0.1:8000/syntax")
          echo "$syntax" | grep -q 'Inline literal'
          echo "$syntax" | grep -q '<dl>'
          echo "$syntax" | grep -q 'doc-noteref'
          echo "syntax markup ok"

          outputs=$(curl -s "http://127.0.0.1:8000/outputs-profiles")
          echo "$outputs" | grep -q 'Plain text'
          echo "$outputs" | grep -q 'Markdown'
          echo "$outputs" | grep -q 'Comment profile'
          echo "$outputs" | grep -q 'id="twig-text-output"'
          echo "$outputs" | grep -q 'id="twig-markdown-output"'
          echo "$outputs" | grep -q '<p># Release notes</p>'
          echo "output targets and profile markup ok"

          kill $SERVER_PID
