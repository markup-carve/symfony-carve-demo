# symfony-carve bundle configuration (Carve 0.2, symfony-carve main).
# Every key the bundle accepts is listed; the "Render options" page shows what each one does.
carve:
    raw_html: false             # raw HTML blocks and spans are escaped; true is for trusted input only
    url_policy: []              # empty: the engine's secure default; or {allow: [https, mailto]} / {deny: [...]}
    profile: full               # full | article | comment | minimal
    mode: interactive           # interactive | static
    sections: true              # wrap each heading and its content in <section>
    heading_ids: keep-case      # off | keep-case | lower | ascii | ascii-lower | ascii-strict | ascii-strict-lower
    source_lines: false         # add data-source-line attributes
    smart_typography: true      # curly quotes, dashes, ellipsis
    soft_break_mode: newline    # newline | space | br: how a line break inside a paragraph renders
    symbols:                    # :name: symbol references
        carve: '🪶'
        tm: '™'
    labels: {}                  # engine label map, e.g. {admonitionNote: 'Hinweis'}
    include_root: '%kernel.project_dir%/content'

    # Extension shortcuts. Tabs and wiki links render through Carve extensions.
    extensions:
        - tabs
        - { type: wikilinks, url_template: 'https://github.com/markup-carve/symfony-carve/wiki/{page}' }

    # Diagram fence presets. A matching fence renders as a hydration element
    # (<pre class="mermaid">...) for a client-side renderer instead of a plain code block.
    # The enum spells Vega-Lite `vega_lite`; the fence word authors type is `vega-lite`.
    diagrams: ['mermaid', 'plantuml', 'graphviz', 'd2', 'vega_lite', 'wavedrom', 'chart', 'abc']

    cache:
        enabled: true
        pool: cache.app
        ttl: 3600
        prefix: carve
        version: 'demo-1'       # required because the tabs extension holds closures
