# symfony-carve bundle configuration.
# See https://github.com/markup-carve/symfony-carve for all options.
carve:
    safe_mode: true   # sanitize HTML (recommended for untrusted input)
    raw_html: strip   # strip | escape | allow

    # Diagram fenced-block presets to enable. A matching fence (e.g. ``` mermaid)
    # then renders as a hydration element (<pre class="mermaid">...) for a
    # client-side renderer to pick up, instead of a plain code block.
    # See the "Diagrams" demo page. Each preset needs its own browser library.
    #
    # All eight presets the bundle supports are enabled here so the demo gallery
    # can draw every one live. Note the enum spelling `vega_lite` (underscore);
    # the fence word authors type is `vega-lite` (hyphen).
    diagrams: ['mermaid', 'plantuml', 'graphviz', 'd2', 'vega_lite', 'wavedrom', 'chart', 'abc']
